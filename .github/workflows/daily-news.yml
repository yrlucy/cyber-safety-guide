name: Daily Security News Update

on:
  schedule:
    # 台灣時間每天上午 08:30（GitHub 排程可能延遲）
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Traditional Chinese converter
        run: python -m pip install 'opencc-python-reimplemented==0.1.7'

      - name: Update and translate security news
        run: python scripts/update_news.py

      - name: Commit updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily security news"
            git push
          else
            echo "No news changes"
          fi
